[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecossistema-juridico"
version = "1.0.0"
description = "Ecossistema jurídico integrado: BJN, Auditoria de Pagamentos, Chatbot e Behavior."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32.5,<3",
    "pydantic>=2.13.0,<3",
    "fastapi>=0.121.2,<1",
    "uvicorn>=0.38.0,<1",
    "python-multipart>=0.0.18,<1",
    "pymupdf>=1.26.0,<2",
    "reportlab>=4.2,<5",
    "charset-normalizer>=2,<4",
    "pandas>=2.2.3,<3",
    "beautifulsoup4>=4.13,<5",
    "openpyxl>=3.1.5,<4",
    "pypdf>=6.0,<7",
    "filelock>=3.18,<4",
    "xlrd>=2,<3",
]

[tool.setuptools]
py-modules = ["gpt_bradesco"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "applications*", "judicial_calc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
